name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tipos, lint, formato, límites, pruebas y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node.js (versión de .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: pnpm (versión fijada en packageManager)
        run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Instalar dependencias desde el lockfile
        run: pnpm install --frozen-lockfile

      - name: Checks
        run: pnpm run check
